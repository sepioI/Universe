<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060B">
<title>Her Universe</title>
<style>
/* ==========================================================================
   HER UNIVERSE: single stylesheet
   1 Tokens · 2 Base · 3 Controls · 4 Intro · 5 HUD & labels · 6 Panel/cards
   7 Photographs · 8 Heart · 9 Finale · 10 Responsive · 11 Reduced motion
   Documented exceptions: [hidden] uses !important (JS toggles it everywhere);
   reduced-motion uses !important to override every component at once.
   ========================================================================== */

/* 1 · TOKENS */
:root{
  --ink:#04050a; --night:#080c1c; --deep:#101a35; --violet:#8c84c4;
  --ivory:#ece8dc; --ivory-2:rgba(236,232,220,.64); --gold:#e3cd9a; --hair:rgba(236,232,220,.18);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Helvetica Neue",Inter,"Segoe UI",system-ui,sans-serif;
  --fs-s:.78rem; --fs-body:1.2rem; --fs-h2:clamp(1.7rem,4.4vw,2.4rem); --fs-h1:clamp(1.7rem,5vw,3rem); --fs-title:clamp(2rem,8vw,4.4rem);
  --sp-1:.5rem; --sp-2:1rem; --sp-3:1.6rem; --sp-4:2.8rem; --edge:max(20px,5vw);
  --ease:cubic-bezier(.16,.84,.24,1); --ease-io:cubic-bezier(.65,0,.35,1);
  --t-fast:.45s; --t-med:1.4s; --t-slow:3.4s;
}

/* 2 · BASE */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--ivory);font:300 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
#sky{position:fixed;inset:0;width:100%;height:100%;opacity:0;transition:opacity 4s ease;touch-action:none;cursor:grab}
body.awake #sky{opacity:1}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr:focus{clip:auto;width:auto;height:auto;left:var(--edge);top:56px;z-index:9;background:var(--night);padding:.4em 1em}
h1,h2{font-family:var(--serif);font-weight:300}

/* 3 · CONTROLS: one quiet text button, underline draws on hover */
.btn{background:none;border:0;color:var(--ivory-2);font:inherit;font-size:var(--fs-s);letter-spacing:.08em;padding:.9em 1em;min-height:44px;cursor:pointer;
  background-image:linear-gradient(var(--gold),var(--gold));background-repeat:no-repeat;background-position:1em calc(100% - .7em);background-size:0 1px;
  transition:color var(--t-fast),background-size var(--t-fast) var(--ease)}
.btn:hover,.btn:focus-visible{color:var(--ivory);background-size:calc(100% - 2em) 1px}
.btn:disabled{opacity:.4;cursor:default}
.x{position:absolute;top:var(--sp-1);right:var(--sp-1);width:44px;height:44px;background:none;border:0;color:var(--ivory);font-size:1.5rem;font-weight:200;cursor:pointer;opacity:.55;transition:opacity var(--t-fast)}
.x:hover{opacity:1}
.acts{display:flex;flex-wrap:wrap;gap:0 var(--sp-2);margin-top:var(--sp-3)}
.skipbtn{margin-top:var(--sp-1);padding-left:0}

/* 4 · INTRO: dark → first light → depth → phrase → invitation */
#intro,#final{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column}
#intro{justify-content:flex-end;align-items:flex-start;gap:var(--sp-3);padding:var(--edge) var(--edge) max(12vh,var(--sp-4));transition:opacity 1.6s var(--ease-io)}
#intro.gone{opacity:0;pointer-events:none}
#intro-phrase{font-family:var(--serif);font-weight:300;font-size:var(--fs-h1);line-height:1.2;letter-spacing:.01em;max-width:14em;text-wrap:balance}
#enter{padding-left:0;font-family:var(--serif);font-style:italic;font-size:1.1rem;letter-spacing:.04em;color:var(--gold);background-position:0 calc(100% - .7em)}
#enter:hover,#enter:focus-visible{background-size:100% 1px;color:var(--gold)}
#intro-phrase,#enter,#f-name,#f-head,#f-msg,#f-sig,#f-back,#f-photo{opacity:0;transform:translateY(12px);filter:blur(8px);
  transition:opacity var(--t-slow) var(--ease),transform var(--t-slow) var(--ease),filter var(--t-slow) var(--ease)}
body.phrase #intro-phrase,body.cta #enter,#final .show{opacity:1;transform:none;filter:none}
#skip{position:fixed;top:max(var(--sp-2),env(safe-area-inset-top));right:var(--sp-2);z-index:9;opacity:.5}

/* 5 · HUD & LABELS: instrument, not toolbar */
#hud{position:fixed;left:0;right:0;bottom:max(var(--sp-1),env(safe-area-inset-bottom));z-index:7;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;padding:0 var(--sp-1);
  opacity:.62;transition:opacity .8s}
#hud:hover,#hud:focus-within{opacity:1}
#hud .btn{padding:.9em .7em;background-position:.7em calc(100% - .7em)}
#hud .btn:hover,#hud .btn:focus-visible{background-size:calc(100% - 1.4em) 1px}
#finale{color:var(--gold)}
#vol{width:64px;accent-color:var(--gold);opacity:.8}
#sound[aria-pressed=false]~#vol{display:none}
#hint{position:fixed;top:max(var(--sp-3),env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:8;width:max-content;max-width:88vw;text-align:center;
  font:italic 1.05rem/1.4 var(--serif);letter-spacing:.03em;opacity:0;transition:opacity 1.4s;pointer-events:none}
#hint.show{opacity:.85}
#region{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:6;width:max-content;max-width:90vw;text-align:center;pointer-events:none;
  font:italic .95rem var(--serif);letter-spacing:.14em;color:var(--ivory);opacity:0;transition:opacity 1.8s}
#region.show{opacity:.6}
#tip{position:fixed;z-index:8;pointer-events:none;transform:translate(-50%,-100%);white-space:nowrap;font:italic .98rem var(--serif);letter-spacing:.05em;padding:.2em .4em;border-bottom:1px solid var(--hair)}
body.quiet #hud>*:not(#quiet),body.quiet #hint,body.quiet #region,body.quiet #tip{opacity:0!important;pointer-events:none}
body.quiet #quiet{opacity:.5}

/* 6 · PANEL: a lit clearing in the sky, not a box */
#panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;opacity:0;transition:opacity .9s var(--ease-io);
  padding:max(var(--sp-2),env(safe-area-inset-top)) max(var(--sp-2),env(safe-area-inset-right)) max(var(--sp-2),env(safe-area-inset-bottom)) max(var(--sp-2),env(safe-area-inset-left));
  background:radial-gradient(ellipse at center,rgba(4,5,10,.9),rgba(4,5,10,.6) 75%)}
#panel.open{opacity:1}
#panel.rare{background:radial-gradient(ellipse at center,rgba(6,5,16,.95),rgba(24,18,40,.7) 80%);transition-duration:1.6s}
.card{position:relative;z-index:2;width:min(34rem,100%);max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;padding:var(--sp-4) var(--sp-2) var(--sp-3)}
.card::before{content:"";display:block;width:0;height:1px;margin-bottom:var(--sp-3);background:var(--ivory-2);transition:width 1.6s var(--ease) .3s}
#panel.open .card::before{width:2.4rem}
#panel.rare .card::before,.card.grail::before{background:var(--gold)}
#panel.rare.open .card::before{width:5rem}
.card h2{font-size:var(--fs-h2);line-height:1.2;letter-spacing:.005em;margin-bottom:var(--sp-3);padding-right:var(--sp-3)}
#panel.rare .card h2,.card.grail h2{color:var(--gold)}
#p-body p,#h-body p,.card.wish p{font:var(--fs-body)/1.75 var(--serif);margin-bottom:.9em;max-width:32em}
.card.wish{text-align:center;width:min(26rem,100%)}
.card.wish::before{margin-inline:auto}
.card.wish p{font-size:1.32rem;margin-inline:auto}
.ln{opacity:0;transform:translateY(8px);filter:blur(6px);transition:opacity 2s var(--ease),transform 2s var(--ease),filter 2s var(--ease)}
.ln.on{opacity:1;transform:none;filter:none}
.card input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--hair);color:inherit;font:inherit;font-size:16px;padding:.6em 0;margin:var(--sp-2) 0 var(--sp-2);border-radius:0}
.card input:focus-visible{outline:0;border-bottom-color:var(--gold)}
.fb{min-height:1.6em;font:italic 1rem var(--serif);opacity:.85}
.card.archive .it{padding:.8rem 0;border-bottom:1px solid var(--hair);font:1.1rem/1.6 var(--serif)}
.card.archive .it.fv::before{content:"— ";color:var(--gold)}
.card.archive .it.gd{color:var(--gold)}
#cons{position:absolute;inset:0;pointer-events:none;z-index:1}
#cons svg{position:absolute;inset:0;width:100%;height:100%}
#cons line{stroke:rgba(205,214,245,.38);stroke-width:1;vector-effect:non-scaling-stroke;opacity:0;transition:opacity 1.6s}
#cons.on line{opacity:1}
.cd{position:absolute;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--ivory);opacity:0;transition:opacity 1.2s}
#cons.on .cd{opacity:1}

/* 7 · PHOTOGRAPHS: revealed like a developing print (clip + focus) */
.ph{position:relative;margin:0 0 var(--sp-3);overflow:hidden;min-height:190px;background:var(--night);clip-path:inset(0 0 100% 0);filter:blur(6px);
  transition:clip-path 2.2s var(--ease-io),filter 2.2s var(--ease)}
.ph.in{clip-path:inset(0);filter:none}
.ph img{display:block;width:100%;max-height:52vh;max-height:52dvh;object-fit:contain;background:transparent}
.ph:not(.ok) img{display:none}
.ph.ok .miss{display:none}
.miss{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:var(--sp-3);font:italic 1rem var(--serif);opacity:.75}
.card.photo{width:min(56rem,100%)}
.card.photo #p-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--sp-4);align-items:center}
.card.photo .ph{margin:0}
.card.photo .ph img{background:transparent;max-height:60vh;max-height:60dvh}
.card.smile .ph{filter:none}

/* 8 · HEART: the central message arrives beside the lit core */
#heart{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overscroll-behavior:contain;opacity:0;transition:opacity 2s var(--ease-io);
  padding:max(var(--sp-3),env(safe-area-inset-top)) var(--sp-3) max(var(--sp-3),env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(4,5,12,0) 12%,rgba(4,5,14,.84) 30%,rgba(4,5,14,.95) 50%)}
#heart.open{opacity:1}
#heart::before,#heart::after{content:"";margin:auto}
#heart .in{width:min(34em,100%);margin-top:34dvh;text-align:center}
#h-close{position:fixed;top:max(var(--sp-1),env(safe-area-inset-top));right:var(--sp-1);z-index:2}
#h-name{font:italic 1.05rem var(--serif);letter-spacing:.3em;color:var(--gold);margin-bottom:var(--sp-1)}
#h-title{font-size:var(--fs-h1);line-height:1.15;margin-bottom:var(--sp-3)}
#h-body p{line-height:1.85;margin-inline:auto}
#h-end{font:italic 1.2rem var(--serif);color:var(--gold);margin:var(--sp-3) 0 var(--sp-1)}
.hid{opacity:0;transition:opacity 2.4s}
.hid.show{opacity:1}
#h-star{background:none;border:0;color:var(--gold);font-size:1.8rem;width:56px;height:56px;cursor:pointer}
#h-star:not(:disabled){animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.82);opacity:.6}}

/* 9 · FINALE: the sky stills, light converges, the message arrives */
#final{align-items:center;text-align:center;padding:var(--edge);overflow-y:auto;transition:opacity 1.2s;
  background:radial-gradient(ellipse at center,rgba(4,5,10,.5),rgba(4,5,10,.12) 70%)}
#final::before,#final::after{content:"";margin:auto}
#f-halo{position:fixed;left:50%;top:46%;width:150vmin;height:150vmin;margin:-75vmin 0 0 -75vmin;border-radius:50%;pointer-events:none;z-index:-1;opacity:0;transform:scale(.55);
  background:radial-gradient(circle,rgba(255,240,205,.14) 0,transparent 22%),radial-gradient(circle,transparent 0 40%,rgba(255,236,190,.55) 40.5%,rgba(227,205,154,.07) 42%,transparent 56%);
  transition:opacity 7s,transform 14s cubic-bezier(.16,.6,.2,1)}
#f-halo.on{opacity:1;transform:scale(1)}
#f-name{font:200 var(--fs-title)/1 var(--serif);letter-spacing:.9em;padding-left:.9em;transition:opacity 5s,transform 5s,filter 5s,letter-spacing 9s var(--ease)}
#f-name.show{letter-spacing:.42em;padding-left:.42em}
#f-head{font-size:var(--fs-h1);line-height:1.25;margin:var(--sp-3) 0 var(--sp-2);max-width:20em;text-wrap:balance}
#f-msg{max-width:30em;white-space:pre-line;font:1.14rem/1.85 var(--serif);text-wrap:pretty}
#f-sig{margin-top:var(--sp-3);font:italic 1.1rem var(--serif);opacity:.8}
#f-photo{width:min(300px,70vw);margin:var(--sp-2) 0 0}
#f-photo .ph{margin:0}
#f-photo .ph img{max-height:22vh;max-height:22dvh}
#f-back{margin-top:var(--sp-4)}
#veil{position:fixed;inset:0;z-index:5;background:var(--ink);opacity:0;pointer-events:none;transition:opacity 1.2s}
#veil.on{opacity:.92}
#fallback{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--ink);text-align:center;padding:var(--sp-3)}

/* 10 · RESPONSIVE: one breakpoint per layout change */
@media (min-width:700px){#region{bottom:64px}}
@media (min-width:800px){
  #heart{align-items:flex-end;padding-right:7vw;background:linear-gradient(90deg,rgba(4,5,12,0) 24%,rgba(4,5,14,.9) 58%)}
  #heart .in{width:min(32em,44vw);margin-top:0;text-align:left}
  #h-body p{margin-inline:0}
}
@media (max-width:820px){.card.photo{width:min(34rem,100%)}.card.photo #p-body{grid-template-columns:1fr;gap:var(--sp-2)}}
@media (max-width:700px){#hud .btn{padding:.9em .5em;font-size:.72rem;background-position:.5em calc(100% - .7em)}#region{bottom:112px}}
@media (max-width:480px){.card{padding:var(--sp-4) .4rem var(--sp-2)}}

/* 11 · REDUCED MOTION */
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}.ph{clip-path:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main id="intro">
  <p id="intro-phrase"></p>
  <button id="enter" class="btn" type="button">Исследовать</button>
</main>
<button id="skip" class="btn sm" type="button">Пропустить</button>

<p id="hint" role="status"></p>
<div id="tip" hidden></div>
<p id="region" aria-hidden="true"></p>
<div id="starnav" aria-label="Звёзды"></div>

<nav id="hud" hidden aria-label="Управление">
  <button id="zin" class="btn sm" type="button" aria-label="Приблизить">+</button>
  <button id="zout" class="btn sm" type="button" aria-label="Отдалить">−</button>
  <button id="compass" class="btn sm" type="button">Компас</button>
  <button id="sound" class="btn sm" type="button" aria-pressed="false">Звук: выкл</button>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="Громкость">
  <button id="fx" class="btn sm" type="button" hidden>Эффекты: полные</button>
  <button id="gift" class="btn sm" type="button">Подарить звезду</button>
  <button id="archive" class="btn sm" type="button">Архив</button>
  <button id="quiet" class="btn sm" type="button" aria-pressed="false">Тишина</button>
  <button id="restart" class="btn sm" type="button">Заново</button>
  <button id="finale" class="btn sm" type="button" hidden>Финал</button>
</nav>

<div id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" hidden>
  <div id="cons"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <div class="card">
    <button id="p-close" class="x" type="button" aria-label="Закрыть">×</button>
    <h2 id="p-title"></h2>
    <div id="p-body"></div>
  </div>
</div>

<section id="heart" hidden role="dialog" aria-modal="true" aria-labelledby="h-title">
  <button id="h-close" class="x" type="button" aria-label="Вернуться во вселенную">×</button>
  <div class="in">
    <p id="h-name"></p>
    <h2 id="h-title">Наша бесконечность</h2>
    <div id="h-body"></div>
    <button id="h-skip" class="btn sm skipbtn" type="button">Показать сразу</button>
    <p id="h-end" class="hid" hidden>И пусть у нашей Вселенной всегда будет продолжение…</p>
    <button id="h-star" class="hid" type="button" hidden aria-label="Отправить звезду в глубину космоса">✦</button>
  </div>
</section>

<section id="final" hidden aria-live="polite">
  <div id="f-halo" aria-hidden="true"></div>
  <p id="f-name"></p>
  <div id="f-photo" hidden></div>
  <h1 id="f-head"></h1>
  <p id="f-msg"></p>
  <p id="f-sig"></p>
  <button id="f-back" class="btn sm" type="button">Вернуться в нашу Вселенную</button>
</section>

<div id="veil"></div>
<div id="fallback" hidden><p>Вселенная не загрузилась. Обнови страницу.</p></div>
<noscript><div id="fallback" style="display:grid"><p>Для этой страницы нужен JavaScript.</p></div></noscript>

  function wish() {
    if (S.state !== 'universe' || S.heartOpen) return;
    const all = LIB.map((_, i) => i), un = all.filter((i) => !S.found.includes(i)), pool = un.length ? un : all, gold = Math.random() < 0.2;
    let p2 = pool.filter((i) => !!LIB[i][1] === gold); if (!p2.length) p2 = pool;
    const i = p2[Math.floor(Math.random() * p2.length)]; if (!S.found.includes(i)) S.found.push(i);
    showCompliment(i);
  }
  function showCompliment(i) {

    if (g) document.querySelector('#panel .card').classList.add('grail');
    const row = el('div', null, 'acts'), fv = el('button', S.fav.has(i) ? 'Сохранено' : 'Сохранить', 'btn sm'), nx = el('button', 'Ещё одна звезда', 'btn sm'), ar = el('button', 'Архив', 'btn sm');
    [fv, nx, ar].forEach((b) => { b.type = 'button'; row.appendChild(b); });
    fv.addEventListener('click', () => { if (S.fav.has(i)) S.fav.delete(i); else S.fav.add(i); fv.textContent = S.fav.has(i) ? 'Сохранено' : 'Сохранить'; });
    nx.addEventListener('click', wish); ar.addEventListener('click', showArchive);
